name: Windows

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/ScanCode.Windows.sln

      - name: Build
        run: dotnet build windows/ScanCode.Windows.sln -c Release --no-restore

      - name: Test core
        run: dotnet test windows/tests/ScanCode.Core.Tests/ScanCode.Core.Tests.csproj -c Release --no-build

      - name: Publish win-x64
        run: >
          dotnet publish windows/src/ScanCode.App/ScanCode.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -o windows/dist

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path windows/dist/* -DestinationPath ScanCode-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ScanCode-win-x64
          path: ScanCode-win-x64.zip
