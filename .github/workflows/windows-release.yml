name: Windows Release

# 发版：打 win-v* 标签（例如 win-v0.1.6）后自动编译、打包并创建 GitHub Release。
# 用 win- 前缀是为了和 macOS 的 v* 标签区分，两边发版互不触发。

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布成 Release 的标签名（已存在的 tag），如 win-v0.1.6'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/ScanCode.Windows.sln

      - name: Build
        run: dotnet build windows/ScanCode.Windows.sln -c Release --no-restore

      - name: Test core
        run: dotnet run --project windows/tests/ScanCode.Core.Tests/ScanCode.Core.Tests.csproj -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/ScanCode.App/ScanCode.App.csproj
          -c Release -r win-x64 -o windows/dist
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false
          -p:DebugType=None -p:DebugSymbols=false

      - name: Zip and checksum
        shell: pwsh
        run: |
          $exe = 'windows/dist/ScanCode.exe'
          if (-not (Test-Path $exe)) { throw 'ScanCode.exe 未生成' }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "ScanCode.exe = $size MB"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  ScanCode.exe" | Set-Content windows/ScanCode-win-x64.exe.sha256 -Encoding ASCII
          Compress-Archive -Path $exe -DestinationPath windows/ScanCode-win-x64.zip -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          $repo = "${{ github.repository }}"
          $assets = @('windows/ScanCode-win-x64.zip', 'windows/ScanCode-win-x64.exe.sha256')
          gh release view $tag -R $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Release 已存在（例如手动建过），只补传附件
            gh release upload $tag @assets -R $repo --clobber
          } else {
            gh release create $tag @assets -R $repo --title "扫码助手 Windows $tag" --generate-notes
          }
